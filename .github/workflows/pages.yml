name: Deploy Secret Santa to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify site files
        run: |
          test -f index.html
          test -f app.js
          test -f config.js
          test -f styles.css
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Confirm Pages artifact is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages")' | grep -q github-pages; then
              exit 0
            fi
            sleep 2
          done
          echo "The github-pages artifact did not appear in the Actions API."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
